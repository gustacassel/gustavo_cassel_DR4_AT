server:
  port: 8082
spring:
  application:
    name: notificacao-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/notificacao_db}
    username: ${DB_USER:freela}
    password: ${DB_PASSWORD:freela}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
    consumer:
      group-id: notificacao-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
app:
  logs:
    gelf:
      host: ${GELF_HOST:localhost}
      port: ${GELF_PORT:12201}
  kafka:
    topico-contratos: contratos.eventos
    topico-contratos-dlt: contratos.eventos.DLT
    particoes: 3
    concurrencia: 3
    retry:
      tentativas: 3
      intervalo-ms: 1000
management:
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
# Appenders e pattern ficam em logback-spring.xml (console + GELF para o Graylog).
logging:
  level:
    root: INFO
    br.com.freela: INFO
